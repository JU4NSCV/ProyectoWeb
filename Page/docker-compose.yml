version: '3.8'

services:
  # 1. Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bazar_db
      POSTGRES_USER: bazar_admin
      POSTGRES_PASSWORD: bazar_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Servidor Backend (Django)
  backend:
    build: ./backend
    command: >
      bash -c "python manage.py migrate && 
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=bazar_db
      - DB_USER=bazar_admin
      - DB_PASSWORD=bazar_password
      - DB_HOST=db
      - DB_PORT=5432

  # 3. Interfaz Frontend (Next.js)
  frontend:
    build: ./frontend
    command: pnpm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api

volumes:
  postgres_data: