version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: bazar_postgres
    restart: always
    environment:
      POSTGRES_DB: bazar_db
      POSTGRES_USER: bazar_admin
      POSTGRES_PASSWORD: bazar_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: bazar_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://bazar_admin:bazar_password@db:5432/bazar_db

volumes:
  postgres_data:
